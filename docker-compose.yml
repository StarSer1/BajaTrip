# Práctica 5 · Balanceo de carga de BajaTrip: un balanceador, dos nodos y una base compartida.
# Antes: copia .env.example a .env y ejecuta npm run build.  Levantar: docker compose up -d --build
# Sitio por el balanceador: http://localhost:8080 · Cada nodo solo: http://localhost:8001 y :8002
name: bajatrip

x-nodo: &nodo
  build: .
  restart: unless-stopped
  environment: &entorno
    PORT: "3000"
    DB_HOST: 172.28.0.20
    DB_DATABASE: bajatrip
    DB_USERNAME: bajatrip
    DB_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env y escribe las contraseñas}
    PROXIES_CONFIABLES: 172.28.0.10   # solo el balanceador puede decir la IP real del visitante
  depends_on:
    db:
      condition: service_healthy

services:
  balanceador:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/balanceo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app1, app2]
    networks:
      bajatrip: { ipv4_address: 172.28.0.10 }

  app1:
    <<: *nodo
    environment:
      <<: *entorno
      NODO: "1"
    ports:
      - "8001:3000"
    networks:
      bajatrip: { ipv4_address: 172.28.0.11 }

  app2:
    <<: *nodo
    environment:
      <<: *entorno
      NODO: "2"                 # lo único que cambia entre los dos
    ports:
      - "8002:3000"
    networks:
      bajatrip: { ipv4_address: 172.28.0.12 }

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bajatrip
      MYSQL_USER: bajatrip
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env y escribe las contraseñas}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Copia .env.example a .env y escribe las contraseñas}
    volumes:
      - datos:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      bajatrip: { ipv4_address: 172.28.0.20 }

networks:
  bajatrip:
    name: bajatrip-red
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  datos:
