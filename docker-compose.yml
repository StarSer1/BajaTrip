# BajaTrip · Prácticas 5 y 6: un balanceador con HTTPS, dos nodos y una base compartida.
# Antes: copia .env.example a .env, ejecuta npm run build y crea el certificado local
#        (bash scripts/certificado-local.sh). Levantar: docker compose up -d --build
# Sitio: https://localhost:8443 (http://localhost:8080 redirige a HTTPS).
# Cada nodo solo, desde este equipo: http://127.0.0.1:8001 y :8002 (nadie de la red los alcanza).
name: bajatrip

x-nodo: &nodo
  build: .
  restart: unless-stopped
  environment: &entorno
    PORT: "3000"
    DB_HOST: 172.28.0.20
    DB_DATABASE: bajatrip
    DB_USERNAME: bajatrip
    DB_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env y escribe las contraseñas}
    PROXIES_CONFIABLES: 172.28.0.10   # solo el balanceador puede decir la IP real del visitante
    TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY:-1x00000000000000000000AA}
    TURNSTILE_SECRET: ${TURNSTILE_SECRET:-1x0000000000000000000000000000000AA}
    SUBIDAS_DIR: /app/subidas
  volumes:
    # El mismo volumen en los dos nodos: la foto subida a uno la puede leer el otro.
    - subidas:/app/subidas
  depends_on:
    db:
      condition: service_healthy

services:
  balanceador:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:-localhost}
      HTTPS_PUERTO: ${HTTPS_PUERTO:-8443}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
      # Certificado local (scripts/certificado-local.sh). Con Let's Encrypt (perfil «publico»):
      #   CERTIFICADO=/etc/letsencrypt/live/<dominio>/fullchain.pem
      #   LLAVE=/etc/letsencrypt/live/<dominio>/privkey.pem
      CERTIFICADO: ${CERTIFICADO:-/etc/nginx/certs/bajatrip.crt}
      LLAVE: ${LLAVE:-/etc/nginx/certs/bajatrip.key}
    ports:
      - "${HTTP_PUERTO:-8080}:80"
      - "${HTTPS_PUERTO:-8443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
      - certbot-web:/var/www/certbot:ro
    # Cada 6 horas vuelve a leer la configuración: así toma el certificado que certbot renovó
    # sin reiniciar el contenedor. «exec» deja a Nginx como proceso principal.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on: [app1, app2]
    networks:
      bajatrip: { ipv4_address: 172.28.0.10 }

  app1:
    <<: *nodo
    environment:
      <<: *entorno
      NODO: "1"
    ports:
      - "127.0.0.1:8001:3000"
    networks:
      bajatrip: { ipv4_address: 172.28.0.11 }

  app2:
    <<: *nodo
    environment:
      <<: *entorno
      NODO: "2"                 # lo único que cambia entre los dos
    ports:
      - "127.0.0.1:8002:3000"
    networks:
      bajatrip: { ipv4_address: 172.28.0.12 }

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bajatrip
      MYSQL_USER: bajatrip
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copia .env.example a .env y escribe las contraseñas}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Copia .env.example a .env y escribe las contraseñas}
    volumes:
      - datos:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      bajatrip: { ipv4_address: 172.28.0.20 }

  # Solo con dominio propio: docker compose --profile publico up -d
  # Renueva el certificado de Let's Encrypt cada 12 h si le faltan menos de 30 días.
  # La primera vez se pide con el comando del README (certbot certonly --webroot).
  certbot:
    image: certbot/certbot:v3.1.0
    profiles: [publico]
    restart: unless-stopped
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - certbot-web:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    networks:
      bajatrip: { ipv4_address: 172.28.0.30 }

networks:
  bajatrip:
    name: bajatrip-red
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  datos:
  subidas:
  certbot-web:
